functions:
  - name: ag2_research
    _type: ag2_research_team
    task: "Research and summarize the current state of Kubernetes-native AI agent frameworks."
    llm_config: default
    max_rounds: 10

llm:
  - name: default
    _type: nim
    model: meta/llama-3.1-8b-instruct
    api_key: ${NVIDIA_API_KEY}
